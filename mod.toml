[manifest]
id = "nelem_mm_clock_3ds"
version = "1.2.1"
display_name = "3DS Clock"
description = """
Replaces the N64 clock with the clock from Majora's Mask 3D: a three-day bar at the bottom of the screen,
a cursor that moves with time and a bubble showing the time with the sun or the moon.

Slowed time (Inverted Song of Time): gold outline, cyan digits and arrow, as on 3DS.
Final six hours: HH:MM:SS countdown.

3DS textures (optional): in this mod's settings, enter the folder of your MM3D 4K texture pack
(or the path of its tex1_512x256_45D746278BB3DA8A_13_mip0.png file). Leave it empty for the clock without textures.

To get the original clock back, just disable this mod.

(FR) L'horloge de Majora's Mask 3D. Textures 3DS : indique le dossier du pack MM3D 4K dans les réglages
du mod ; champ vide = horloge sans textures."""
short_description = "The Majora's Mask 3D clock at the bottom of the screen."
authors = [ "Nelem" ]
game_id = "mm"
minimum_recomp_version = "1.2.2"
dependencies = [
]
optional_dependencies = [
]
native_libraries = [
    { name = "clock3ds_textures", funcs = ["clock3ds_tex_load", "clock3ds_tex_dims", "clock3ds_tex_copy", "clock3ds_tex_free"] },
]

[[manifest.config_options]]
id = "atlas_path"
name = "Texture pack folder (MM3D 4K)"
description = '''Folder of Henriko Magnifico's MM3D 4K texture pack, or the path of its
tex1_512x256_45D746278BB3DA8A_13_mip0.png file. Quotes are fine.

Example: C:\Users\Me\Desktop\MM3D 4K   (Linux / macOS: ~/MM3D 4K)

Leave empty for the clock without textures. Applied within a second or two.

(FR) Dossier du pack de textures MM3D 4K, ou chemin du fichier. Vide = horloge sans textures.'''
type = "String"
default = ""

[inputs]
elf_path = "build/mod.elf"
mod_filename = "nelem_mm_clock_3ds"
func_reference_syms_file = "Zelda64RecompSyms/mm.us.rev1.syms.toml"
data_reference_syms_files = [ "Zelda64RecompSyms/mm.us.rev1.datasyms.toml", "Zelda64RecompSyms/mm.us.rev1.datasyms_static.toml" ]
additional_files = [ ]
